name: Windows RDP Runner

on:
  workflow_dispatch:
    inputs:
      user_prefix:
        description: 'Username prefix for runner host identification'
        required: true
        default: 'user'
        type: string

jobs:
  provision-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Software and Playwright
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # 1. Silently install Google Chrome
          Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "$env:TEMP\chrome_installer.exe"
          Start-Process "$env:TEMP\chrome_installer.exe" -ArgumentList "/silent", "/install" -Wait
          Remove-Item "$env:TEMP\chrome_installer.exe" -Force -ErrorAction SilentlyContinue

          # 2. Silently install WinRAR (x64)
          Invoke-WebRequest -Uri "https://www.rarlab.com/rar/winrar-x64-701.exe" -OutFile "$env:TEMP\winrar_installer.exe"
          Start-Process "$env:TEMP\winrar_installer.exe" -ArgumentList "/s" -Wait
          Remove-Item "$env:TEMP\winrar_installer.exe" -Force -ErrorAction SilentlyContinue

          # 3. Attempt Python 3.14.5 install without blocking on exit code
          $PythonVersion = "3.14.5"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$PythonVersion/python-$PythonVersion-amd64.exe" -OutFile "$env:TEMP\python_installer.exe"
          $PythonArgs = @(
              '/quiet',
              'InstallAllUsers=1',
              'PrependPath=1',
              'Include_test=0'
          )
          Start-Process -FilePath "$env:TEMP\python_installer.exe" -ArgumentList $PythonArgs -Wait
          Remove-Item "$env:TEMP\python_installer.exe" -Force -ErrorAction SilentlyContinue

          # Refresh environment PATH for current session
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")

          # 4. Install Playwright and its Chromium binaries
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium

      - name: Install Latest AliasMode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $TargetDir = "C:\Temp"
          New-Item -ItemType Directory -Path $TargetDir -Force | Out-Null

          $Headers = @{
              "User-Agent"    = "Windows-RDP-Runner"
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          }
          $Releases = Invoke-RestMethod -Uri "https://api.github.com/repos/aliasmode/aliasmode/releases?per_page=10" -Headers $Headers
          $Asset = $Releases |
              Where-Object { -not $_.draft } |
              ForEach-Object { $_.assets } |
              Where-Object { $_.name -like "*_x64-offline-setup.exe" } |
              Select-Object -First 1

          if (-not $Asset) {
              throw "Could not locate an x64 offline setup asset in recent aliasmode/aliasmode releases."
          }

          $InstallerPath = Join-Path $TargetDir $Asset.name
          Write-Host "Downloading $($Asset.name)..."
          Invoke-WebRequest -Uri $Asset.browser_download_url -OutFile $InstallerPath

          Write-Host "Running silent NSIS installation..."
          $Proc = Start-Process -FilePath $InstallerPath -ArgumentList "/S" -Wait -PassThru
          if ($Proc.ExitCode -ne 0) {
              throw "AliasMode installer exited with code $($Proc.ExitCode)."
          }
          Remove-Item $InstallerPath -Force -ErrorAction SilentlyContinue

          $AliasModeExe = Join-Path $env:LOCALAPPDATA "AliasMode\AliasMode.exe"
          if (-not (Test-Path $AliasModeExe)) {
              throw "AliasMode.exe not found at expected path: $AliasModeExe"
          }
          Write-Host "AliasMode installed successfully at $AliasModeExe"

      - name: Pre-download AliasMode Chromium Engine
        shell: powershell
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $AliasModeDir = Join-Path $env:LOCALAPPDATA "AliasMode"
          $Sidecar = Join-Path $AliasModeDir "aliasmode-sidecar.exe"

          if (-not (Test-Path $Sidecar)) {
              Write-Warning "aliasmode-sidecar.exe not found at $Sidecar. Skipping engine pre-download."
              exit 0
          }

          Write-Host "Pre-downloading default AliasMode Chromium engine..."
          Push-Location $AliasModeDir
          try {
              & $Sidecar install-browser
              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Sidecar install-browser returned exit code $LASTEXITCODE."
                  exit $LASTEXITCODE
              }
              Write-Host "AliasMode Chromium engine pre-downloaded successfully."
          } finally {
              Pop-Location
          }

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Credentials
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password

      - name: Install and Connect Tailscale
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process "$env:TEMP\tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\tailscale-setup.exe" -Force -ErrorAction SilentlyContinue
          $env:Path += ";C:\Program Files\Tailscale"
          Start-Sleep -Seconds 3
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="${{ inputs.user_prefix }}-${{ github.run_id }}" --accept-routes

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600
