name: Windows RDP Runner

on:
  workflow_dispatch:
    inputs:
      user_prefix:
        description: 'Username prefix for runner host identification'
        required: true
        default: 'user'
        type: string

jobs:
  provision-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          auth-key: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ephemeral: true
          args: --hostname=${{ inputs.user_prefix }}-${{ github.run_id }}

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Credentials
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $UserAccount = Get-LocalUser -Name "runneradmin"
          $UserAccount | Set-LocalUser -Password $Password

      - name: Keep Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600
